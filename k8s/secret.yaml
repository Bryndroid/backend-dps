apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "replace-root-password"
  DATABASE_USER: "backend"
  DATABASE_PASSWORD: "replace-database-password"
  DATABASE_NAME: "learning"
  DATABASE_URL: "mysql://backend:replace-database-password@mysql:3306/learning"
  JWT_SECRET_KEY: "replace-with-a-long-random-secret"
  GEMINI_API_KEY: "replace-with-your-gemini-api-key"